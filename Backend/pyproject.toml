[project]
name = "himatkn-backend"
version = "1.0.0"
description = "HIMATKN FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "PyJWT>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "python-multipart>=0.0.20,<1.0",
    "Pillow>=11.0,<13.0",
    "redis>=5.2,<7.0",
    "boto3>=1.36,<2.0",
    "vercel==0.13.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100