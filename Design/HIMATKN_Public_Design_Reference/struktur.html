<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HIMATKN public design reference">
  <title>Struktur Kepengurusan • HIMATKN</title>
  <link rel="stylesheet" href="assets/site.css">
  
</head>
<body data-page="structure">
  <header class="site-header" data-site-header></header>
  
<main class="structure-page">
<section class="page-hero"><div class="page-hero-inner"><div class="kicker">Struktur kepengurusan</div><h1>Susunan Kepengurusan</h1><p>Periode aktif, divisi, jabatan, dan anggota berasal dari GET /api/v1/public/organization.</p></div></section>
<section class="section"><div class="section-inner">
  <div class="switcher"><button class="active" id="tabDivision">Per Divisi</button><button id="tabAll">Lihat Semua</button></div>
  <div class="select-wrap"><label for="divisionSelect">Pilih Divisi</label><select id="divisionSelect" class="select-control"></select></div>
  <div id="divisionView"></div>
  <div id="allView" class="tree-all" hidden></div>
</div></section>
</main>
<script>
const DATA = {
  period:{id:1,name:'2025/2026'},
  divisions:[
    {id:1,name:'Pembimbing',description:'Dosen pembimbing himpunan'},
    {id:2,name:'Badan Pengurus Harian (BPH)',description:'Badan Pengurus Harian HIMATKN'},
    {id:3,name:'Divisi Internal',description:null},{id:4,name:'Divisi Eksternal',description:null},{id:5,name:'Divisi Reaksi',description:null},{id:6,name:'Divisi Minat dan Bakat',description:null},{id:7,name:'Divisi Keuangan',description:null},{id:8,name:'Divisi Minfo',description:null},{id:9,name:'Divisi Sosmas',description:null}
  ],
  positions:[{id:1,name:'Ketua Himpunan'},{id:2,name:'Wakil Ketua Himpunan'},{id:3,name:'Sekretaris I'},{id:4,name:'Sekretaris II'},{id:5,name:'Bendahara I'},{id:6,name:'Bendahara II'},{id:7,name:'Kepala Divisi'},{id:8,name:'Sekretaris Divisi'},{id:9,name:'Anggota'},{id:10,name:'Dosen Pembimbing'}],
  members:[
    {id:1,name:'Hans Marvin Bonie Passus Sembiring',division_id:2,position_id:1,photo_url:null,sort_order:1},
    {id:2,name:'Muhammad Qhodarudin',division_id:2,position_id:2,photo_url:null,sort_order:2},
    {id:3,name:'Karina Mahsa Aline',division_id:2,position_id:3,photo_url:null,sort_order:3},
    {id:4,name:'Adya Lingga Maharani Subroto',division_id:2,position_id:4,photo_url:null,sort_order:4},
    {id:5,name:'Karina Ramadhani Syaputri',division_id:2,position_id:5,photo_url:null,sort_order:5},
    {id:6,name:'Tirsa Oktavina Br Perangin-Angin',division_id:2,position_id:6,photo_url:null,sort_order:6},
    {id:7,name:'Muhammad Arvyanto Fakhri R.',division_id:3,position_id:7,photo_url:null,sort_order:1},
    {id:8,name:'Desirangin Dedahan Maulia',division_id:3,position_id:8,photo_url:null,sort_order:2},
    {id:9,name:'Sindi Aulia Safitri',division_id:3,position_id:9,photo_url:null,sort_order:3},
    {id:10,name:'Daris Dzakir',division_id:3,position_id:9,photo_url:null,sort_order:4},
    {id:11,name:'Maura Layisha Ramadhani',division_id:3,position_id:9,photo_url:null,sort_order:5},
    {id:12,name:'Muhammad Lutfi Al Fattah',division_id:3,position_id:9,photo_url:null,sort_order:6}
  ]
};
const posById=Object.fromEntries(DATA.positions.map(x=>[x.id,x.name]));
const divById=Object.fromEntries(DATA.divisions.map(x=>[x.id,x]));
const sel=document.getElementById('divisionSelect');
DATA.divisions.forEach(d=>{ const o=document.createElement('option'); o.value=d.id; o.textContent=d.name; sel.appendChild(o); });
function esc(v){return v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
function card(m){return `<article class="member-card"><div class="member-photo"><span data-icon="image"></span></div><div class="member-role">${esc(posById[m.position_id]||'Jabatan')}</div><div class="member-period">${DATA.period.name}</div><div class="member-name">${esc(m.name)}</div></article>`}
function renderDivision(id){
  const d=divById[id], members=DATA.members.filter(m=>m.division_id===id).sort((a,b)=>a.sort_order-b.sort_order);
  if(!members.length){document.getElementById('divisionView').innerHTML=`<div class="empty-box"><h3>Belum ada anggota di divisi ini</h3><p>State ini digunakan ketika divisions tersedia tetapi members untuk division_id tersebut kosong.</p></div>`;return;}
  if(id===2){
    const top=members[0], rest=members.slice(1);
    document.getElementById('divisionView').innerHTML=`<h2 class="structure-heading">${esc(d.name)}</h2><div class="structure-tree"><div class="tree-top">${card(top)}</div><div class="tree-connector"></div><div class="tree-grid">${rest.map(card).join('')}</div></div>`;
  } else {
    document.getElementById('divisionView').innerHTML=`<h2 class="structure-heading">${esc(d.name)}</h2><div class="member-grid">${members.map(card).join('')}</div>`;
  }
  document.querySelectorAll('[data-icon]').forEach(el=>{const n=el.dataset.icon;if(window.ICONS?.[n])el.innerHTML=window.ICONS[n]});
}
function renderAll(){
  document.getElementById('allView').innerHTML=DATA.divisions.map(d=>{const ms=DATA.members.filter(m=>m.division_id===d.id);if(!ms.length)return `<section class="division-block"><h3>${esc(d.name)}</h3><div class="empty-box"><h3>Tidak ada anggota</h3><p>Belum ada data anggota untuk divisi ini.</p></div></section>`;return `<section class="division-block"><h3>${esc(d.name)}</h3><div class="member-grid">${ms.map(card).join('')}</div></section>`}).join('');
  document.querySelectorAll('[data-icon]').forEach(el=>{const n=el.dataset.icon;if(window.ICONS?.[n])el.innerHTML=window.ICONS[n]});
}
sel.addEventListener('change',()=>renderDivision(Number(sel.value)));
document.getElementById('tabDivision').addEventListener('click',()=>{document.getElementById('tabDivision').classList.add('active');document.getElementById('tabAll').classList.remove('active');document.getElementById('divisionView').hidden=false;document.getElementById('allView').hidden=true;document.querySelector('.select-wrap').style.display='block';});
document.getElementById('tabAll').addEventListener('click',()=>{document.getElementById('tabAll').classList.add('active');document.getElementById('tabDivision').classList.remove('active');document.getElementById('divisionView').hidden=true;document.getElementById('allView').hidden=false;document.querySelector('.select-wrap').style.display='none';renderAll();});
sel.value='2';renderDivision(2);
</script>

  <footer class="site-footer" data-site-footer></footer>
  <script src="assets/icons.js"></script>
  <script>window.ICONS = ICONS;</script>
  <script src="assets/site.js"></script>
</body>
</html>
