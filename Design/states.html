<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri state · HIMATKN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "Inter", sans-serif; background: #06261B; color: #fff; }
    header { padding: 40px 40px 8px; max-width: 1400px; margin: auto; }
    h1 { font: 600 36px "Literata", serif; margin: 0 0 8px; }
    header p { color: #A9BBB1; margin: 0; max-width: 70ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 680px), 1fr)); gap: 32px; padding: 32px 40px 80px; max-width: 1400px; margin: auto; }
    figure { margin: 0; }
    figcaption { font: 13px "Inter", sans-serif; color: #A7B8B0; letter-spacing:.06em; text-transform:uppercase; font-weight:600; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
    figcaption a { color: #A9BBB1; }
    .frame { position: relative; overflow: hidden; border-radius: 8px; background: #F7F8F5; border: 1px solid #2A4A3D; }
    .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
    .desk { aspect-ratio: 1280 / 820; }
    .desk iframe { width: 1280px; height: 820px; }
    .mob { width: 200px; flex: none; aspect-ratio: 390 / 780; }
    .mob iframe { width: 390px; height: 780px; }
    .pair { display: flex; gap: 16px; align-items: flex-start; }
    h2 { grid-column: 1 / -1; font: 600 22px "Literata", serif; margin: 24px 0 -8px; border-top: 1px solid #2A4A3D; padding-top: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>Galeri state UI</h1>
    <p>Semua state halaman HIMATKN (desain old_desktop/old_mobile) dalam satu layar. Setiap pratinjau adalah halaman asli yang dibuka dengan parameter URL; klik "buka" untuk melihat ukuran penuh.</p>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const groups = [
      ["Beranda", [
        ["Normal", "index.html"],
        ["Header setelah scroll", "index.html?header=scrolled#program-kerja"],
        ["Menu mobile terbuka", "index.html?menu=open", "mob"],
        ["Loading seluruh halaman", "index.html?loading=all"],
      ]],
      ["Program kerja", [
        ["Terisi", "index.html#program-kerja"],
        ["Kosong", "index.html?proker=empty#program-kerja"],
        ["Memuat", "index.html?proker=loading#program-kerja"],
        ["Gagal dimuat", "index.html?proker=error#program-kerja"],
        ["Halaman · filter", "kegiatan.html?filter=berjalan"],
        ["Halaman · kosong", "kegiatan.html?proker=empty"],
        ["Halaman · hasil pencarian", "kegiatan.html?q=podcast"],
        ["Halaman · pencarian tanpa hasil", "kegiatan.html?q=seminar"],
        ["Halaman · loading", "kegiatan.html?loading=all"],
        ["Detail program kerja", "artikel.html?type=proker&id=dies-natalis"],
      ]],
      ["Publikasi", [
        ["Terisi", "index.html#publikasi"],
        ["Kosong", "index.html?news=empty#publikasi"],
        ["Memuat", "index.html?news=loading#publikasi"],
        ["Halaman daftar", "publikasi.html"],
        ["Hasil pencarian", "publikasi.html?q=pelantikan"],
        ["Pencarian tanpa hasil", "publikasi.html?q=lomba"],
        ["Detail · loading", "artikel.html?type=berita&id=setelah-pelantikan&loading=all"],
        ["Detail artikel", "artikel.html?type=berita&id=setelah-pelantikan"],
        ["Detail tidak ditemukan", "artikel.html?type=berita&id=xyz"],
      ]],
      ["Struktur", [
        ["Beranda · terisi", "index.html#kepengurusan"],
        ["Beranda · kosong", "index.html?struktur=empty#kepengurusan"],
        ["Per divisi (BPH)", "struktur.html"],
        ["Divisi tanpa data", "struktur.html?div=reaksi"],
        ["Lihat semua", "struktur.html?view=semua"],
        ["Memuat", "struktur.html?struktur=loading"],
        ["Gagal dimuat", "struktur.html?struktur=error"],
        ["Loading seluruh halaman", "struktur.html?loading=all"],
      ]],
      ["Dokumen", [
        ["Terisi", "dokumen.html"],
        ["Kosong", "dokumen.html?dokumen=empty"],
        ["Memuat", "dokumen.html?dokumen=loading"],
        ["Gagal dimuat", "dokumen.html?dokumen=error"],
      ]],
      ["Lainnya", [
        ["Dropdown Informasi terbuka", "index.html?info=open"],
        ["Peta gagal dimuat", "index.html?map=error#kepengurusan"],
        ["404", "404.html"],
      ]],
    ];
    const withPanelOff = (u) => { const [p, h] = u.split("#"); return p + (p.includes("?") ? "&" : "?") + "panel=off" + (h ? "#" + h : ""); };
    const grid = document.getElementById("grid");
    let html = "";
    for (const [title, items] of groups) {
      html += `<h2>${title}</h2>`;
      for (const [label, url, only] of items) {
        const src = withPanelOff(url);
        html += `<figure><figcaption><span>${label}</span><a href="${src}" target="_blank">buka ↗</a></figcaption><div class="pair">
          ${only === "mob" ? "" : `<div class="frame desk" style="flex:1"><iframe loading="lazy" title="${label} desktop" src="${src}"></iframe></div>`}
          <div class="frame mob"><iframe loading="lazy" title="${label} mobile" src="${src}"></iframe></div></div></figure>`;
      }
    }
    grid.innerHTML = html;
    const fit = () => document.querySelectorAll(".frame").forEach((f) => {
      const ifr = f.querySelector("iframe"); ifr.style.transform = `scale(${f.clientWidth / ifr.offsetWidth})`;
    });
    addEventListener("resize", fit); fit();
  </script>
</body>
</html>
